[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norain"
version = "0.2.0.dev0"
description = "Norain：基于 sing-box 的 Hysteria2/Trojan 客户端与服务端控制层"
requires-python = ">=3.11"
readme = "README.md"
# 见 docs/decisions/0003-python-build-cli.md
dependencies = ["pydantic>=2.5", "cryptography>=42", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
norain = "norain.cli:main"
norain-server = "norain_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
