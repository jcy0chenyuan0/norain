[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norain"
version = "0.2.0"
description = "Norain：基于 sing-box 的 Hysteria2/Trojan 客户端与服务端控制层"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jcy0chenyuan0", email = "jboxi@qq.com" }]
keywords = ["sing-box", "hysteria2", "trojan", "proxy", "vpn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
# 见 docs/decisions/0003-python-build-cli.md
dependencies = ["pydantic>=2.5", "cryptography>=42", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/jcy0chenyuan0/norain"
Repository = "https://github.com/jcy0chenyuan0/norain"
Issues = "https://github.com/jcy0chenyuan0/norain/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
norain = "norain.cli:main"
norain-server = "norain_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
