name: publish

# PyPI 发布：使用 Trusted Publishing（OIDC），不需要 API token。
# 在 PyPI 项目设置里添加一次：
#   Owner: jcy0chenyuan0   Repository: norain
#   Workflow: publish.yml   Environment: pypi
# 发布 Release 或手动触发本工作流即可上传。若想改用 token 方式，
# 在仓库 Secrets 里加 PYPI_API_TOKEN，并给下面的 publish 步骤传 password。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/norain
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
